name: Забрать 2.32 с Google Диска (разово)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-2.32.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github
      - name: Скачать с Google Диска и проверить
        run: |
          set -e
          get() { curl -fsSL --retry 3 -o "$2" "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"; }
          get 1twJLImTNHhObt37Pn4KithDk8E_cGhV- Probeg.apk
          get 13sg3gQdz7pdTgANG-_PPzHKzYQ6yxRQx Probeg-arm64.apk
          cat > version.json <<'JSON'
          {
            "version": "2.32",
            "version_code": 1024232,
            "url": "https://raw.githubusercontent.com/Alexey-Print/probeg-download/main/Probeg.apk",
            "note": "Диагностика пробуждения Honda и проверка фонового запуска.",
            "universal": {
              "size": 36883517,
              "sha256": "a619a587ea2e215683032b3958416e527b8a01c2d9d383eb46a9dee1c43cfbfc"
            },
            "arm64": {
              "size": 19495170,
              "sha256": "0a906fd4985fa02ab39db32cfd9097bbe318852e381e04324857f394e4628071"
            }
          }
          JSON
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          info = json.loads(Path('version.json').read_text())
          for key, name in (('universal', 'Probeg.apk'), ('arm64', 'Probeg-arm64.apk')):
              raw = Path(name).read_bytes()
              assert raw[:2] == b'PK', name + ': не APK (Диск отдал страницу вместо файла)'
              assert len(raw) == info[key]['size'], name + ': размер не совпал'
              assert hashlib.sha256(raw).hexdigest() == info[key]['sha256'], name + ': SHA-256 не совпал'
              print(name, 'OK', len(raw))
          PY
      - name: Проверить версию внутри APK
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          for f in Probeg.apk Probeg-arm64.apk; do
            "$BT/aapt" dump badging "$f" | head -1
            "$BT/aapt" dump badging "$f" | head -1 | grep -q "name='ru.aleksey.probeg' versionCode='1024232' versionName='2.32'"
            "$BT/apksigner" verify --print-certs "$f" | grep -m1 'SHA-256'
          done
          "$BT/apksigner" verify --print-certs Probeg.apk | grep -m1 'SHA-256' > new.txt
          git fetch --depth 1 origin main
          git show origin/main:Probeg.apk > old.apk
          "$BT/aapt" dump badging old.apk | head -1
          "$BT/apksigner" verify --print-certs old.apk | grep -m1 'SHA-256' > old.txt
          diff old.txt new.txt && echo "Подпись совпадает с прежней версией"
          rm -f old.apk old.txt new.txt
      - name: Опубликовать одним коммитом
        run: |
          git config user.name "probeg-publish"
          git config user.email "probeg-publish@users.noreply.github.com"
          git add --sparse Probeg.apk Probeg-arm64.apk version.json
          git commit -m "Пробег 2.32 (1024232): Probeg.apk, Probeg-arm64.apk, version.json [skip ci]"
          git push origin HEAD:main
