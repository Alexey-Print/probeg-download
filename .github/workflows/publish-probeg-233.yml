name: Publish Probeg 2.33
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-probeg-233.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Probeg.apk
            /Probeg-arm64.apk
            /version.json
            /README.md
      - name: Restore and verify the signed 2.33 packages
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          curl -fLsS --retry 3 -o "$tmp_dir/base.apk" https://raw.githubusercontent.com/Alexey-Print/probeg-download/36338bf51ae7d1ece466274a4d16f5310a79a808/Probeg.apk
          curl -fLsS --retry 3 -o "$tmp_dir/base-arm64.apk" https://raw.githubusercontent.com/Alexey-Print/probeg-download/36338bf51ae7d1ece466274a4d16f5310a79a808/Probeg-arm64.apk
          printf '%s  %s\n' 'a619a587ea2e215683032b3958416e527b8a01c2d9d383eb46a9dee1c43cfbfc' "$tmp_dir/base.apk" '0a906fd4985fa02ab39db32cfd9097bbe318852e381e04324857f394e4628071' "$tmp_dir/base-arm64.apk" | sha256sum -c
          cat "$tmp_dir/base.apk" "$tmp_dir/base-arm64.apk" > "$tmp_dir/base-pair"
          zstd -q -d --patch-from="$tmp_dir/base-pair" .github/probeg-233.zst -o "$tmp_dir/pair"
          python3 - "$tmp_dir/pair" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          version = {
              "version": "2.33",
              "version_code": 1024233,
              "url": "https://raw.githubusercontent.com/Alexey-Print/probeg-download/main/Probeg.apk",
              "note": "Восстановление версии 2.31 после ошибки запуска 2.32.",
              "universal": {
                  "size": 36879421,
                  "sha256": "2a96146b57404f72771da801068e7f8b1ca51d867ce9235a20f98ff428c762a7",
              },
              "arm64": {
                  "size": 19491074,
                  "sha256": "f9e50deefde7dd6d3de3131f89f509d214a4fb9dbc26f4b00ecc77ec007422e1",
              },
          }
          with Path(sys.argv[1]).open('rb') as package_pair:
              for key, name in [('universal', 'Probeg.apk'), ('arm64', 'Probeg-arm64.apk')]:
                  expected = version[key]
                  apk = package_pair.read(expected['size'])
                  assert len(apk) == expected['size'], name
                  assert hashlib.sha256(apk).hexdigest() == expected['sha256'], name
                  Path(name).write_bytes(apk)
              assert not package_pair.read(1), 'Unexpected trailing bytes'
          Path('version.json').write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in Probeg.apk Probeg-arm64.apk; do
            "$build_tools/aapt" dump badging "$apk" > "$tmp_dir/badging"
            grep -F "name='ru.aleksey.probeg' versionCode='1024233' versionName='2.33'" "$tmp_dir/badging"
            "$build_tools/apksigner" verify --print-certs "$apk" > "$tmp_dir/cert"
            cat "$tmp_dir/cert"
          grep -Fi 'ae84ec073947961c4f0f5d9e53441dddb00f4c0a262ebbe369aa5011f689ce8a' "$tmp_dir/cert"
          done
      - name: Publish both APKs and version.json together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name probeg-publish
          git config user.email probeg-publish@users.noreply.github.com
          cat > README.md <<'README'
          # Пробег — скачать приложение

          Текущая версия: **2.33** (1024233).

          - [Универсальный APK для телефона и магнитолы](https://raw.githubusercontent.com/Alexey-Print/probeg-download/main/Probeg.apk)
          - [Уменьшенный APK для ARM64](https://raw.githubusercontent.com/Alexey-Print/probeg-download/main/Probeg-arm64.apk)

          Устанавливайте поверх прежней версии, не удаляя приложение.

          Версия 2.33 восстанавливает код 2.31 после сбоя запуска 2.32. Для обновления используется тот же пакет и сертификат подписи. Проверка обновлений получает текущую версию из version.json.
          README
          git add --sparse -- Probeg.apk Probeg-arm64.apk version.json README.md
          git rm -- .github/probeg-233.zst .github/workflows/publish-probeg-233.yml
          git commit -m 'Пробег 2.33 (1024233): Probeg.apk, Probeg-arm64.apk, version.json [skip ci]'
          git push origin HEAD:main
